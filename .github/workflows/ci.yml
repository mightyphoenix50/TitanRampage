name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rokit toolchain
        uses: CompeyDev/setup-rokit@v0.2.1
        with:
          version: v1.2.0
          cache: true

      - name: Rojo build
        run: rojo build -o TitanRampage.rbxlx

      - name: Selene lint
        # Errors fail the build; the remaining unused-variable warnings are reported but tolerated
        run: selene --allow-warnings src

      - name: StyLua format check
        run: stylua --check src
